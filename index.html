<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glotto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#15803d">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261109142921">
<link rel="manifest" href="manifest.json?v=20261109142921">
<title>Glotto</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #ffffff; color: #000000;
  font: 18px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 1.6rem; margin: 4px 0 2px; color: #15803d; }
.updated { color: #333333; font-size: 1rem; margin: 0 0 16px; }
.night { border-top: 3px solid #000000; padding: 12px 0 8px; }
h2 { font-size: 1.35rem; margin: 0 0 4px; }
.cost { font-size: 1.05rem; margin: 0 0 8px; font-weight: 600; }
h3 { font-size: 1.1rem; margin: 12px 0 6px; }
ul { list-style: none; padding: 0; margin: 0; }
li { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.ball { display: inline-block; min-width: 2.6rem; padding: 6px 0; text-align: center; border-radius: 999px;
  border: 2px solid #000000; font: 700 1.45rem/1 ui-monospace, Menlo, Consolas, monospace; }
.ball.pb { background: #c8102e; border-color: #c8102e; color: #ffffff; }
.empty { font-size: 1.1rem; }
</style>
</head>
<body>
<main>
<h1>Glotto</h1>
<p class="updated">Updated Mon Nov 9, 2:29 PM</p>
<p class="empty">No tickets yet. They show up here after the next run at home.</p>
</main>
</body>
</html>
